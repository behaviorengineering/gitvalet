name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        go: ["1.26.0", "1.26.5"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify modules tidy
        env:
          GOWORK: off
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go tool task tidy
          diff -u go.mod.bak go.mod
          diff -u go.sum.bak go.sum
          rm -f go.mod.bak go.sum.bak

      - name: Format check
        env:
          GOWORK: off
        run: |
          unformatted=$(go tool gofumpt -l ./cmd ./internal ./pkg)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        env:
          GOWORK: off
        run: go tool task vet

      - name: Lint
        env:
          GOWORK: off
        run: go tool task lint

      - name: Test
        env:
          GOWORK: off
        run: go tool task test

      - name: Build
        env:
          GOWORK: off
        run: go tool task build

      - name: CLI smoke
        env:
          GOWORK: off
        run: go tool task smoke

      - name: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
